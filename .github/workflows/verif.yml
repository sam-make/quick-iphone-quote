name: Vérifications de la pull request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verifier:
    name: Installation, types, lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Bun
        uses: oven-sh/setup-bun@v2
      - name: Installer les paquets sans scripts tiers
        id: install
        run: bun install --ignore-scripts
      - name: Vérifier les types TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bunx tsc --noEmit
      - name: Vérifier le lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint
      - name: Exécuter les tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test
      - name: Préparer une configuration locale fictive pour le rendu serveur
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          cat > .dev.vars <<'EOF'
          SUPABASE_URL="https://staging.example.invalid"
          SUPABASE_PUBLISHABLE_KEY="sb_publishable_preview_dummy"
          EOF
      - name: Compiler l'application
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build
      - name: Vérifier le rendu réel du Worker sans déploiement
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/smoke-worker-preview.sh
  secrets:
    name: Vérifier les secrets des fichiers de la PR
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code complet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rechercher des secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

